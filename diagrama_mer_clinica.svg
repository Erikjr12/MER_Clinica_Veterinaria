<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#2563eb" />
    </marker>
  </defs>

  <!-- CABEÇALHO DO DOCUMENTO -->
  <rect x="30" y="20" width="1000" height="60" rx="8" fill="#1e293b" filter="url(#shadow)" />
  <text x="50" y="47" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.5">SISTEMA DE CONTROLE DE VACINAÇÃO — CLÍNICA VETERINÁRIA</text>
  <text x="50" y="66" fill="#94a3b8" font-size="12">SENAI • Técnico em Desenvolvimento de Sistemas • Modelagem de Banco de Dados (MER)</text>
  <rect x="880" y="32" width="130" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="945" y="53" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">MODELO RELACIONAL</text>

  <!-- ========================================== -->
  <!-- LINHAS DE RELACIONAMENTO (RENDERIZADAS PRIMEIRO) -->
  <!-- ========================================== -->

  <!-- 1. CLIENTE (1,1) para ANIMAL (0,N) -->
  <path d="M 360 210 L 550 210" stroke="#3b82f6" stroke-width="2.5" fill="none" />
  <!-- Losango / Badge de Relacionamento -->
  <rect x="420" y="196" width="70" height="26" rx="13" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="213" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">possui</text>
  <!-- Cardinalidades -->
  <text x="375" y="200" fill="#1e293b" font-size="12" font-weight="700">1,1</text>
  <text x="525" y="200" fill="#1e293b" font-size="12" font-weight="700">0,N</text>

  <!-- 2. ANIMAL (1,1) para APLICACAO_VACINA (0,N) -->
  <path d="M 705 380 L 705 460" stroke="#0ea5e9" stroke-width="2.5" fill="none" />
  <!-- Losango / Badge de Relacionamento -->
  <rect x="670" y="405" width="70" height="26" rx="13" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="705" y="422" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">recebe</text>
  <!-- Cardinalidades -->
  <text x="715" y="398" fill="#1e293b" font-size="12" font-weight="700">1,1</text>
  <text x="715" y="452" fill="#1e293b" font-size="12" font-weight="700">0,N</text>

  <!-- 3. VACINA (1,1) para APLICACAO_VACINA (0,N) - DOSE APLICADA -->
  <path d="M 360 520 L 550 520" stroke="#10b981" stroke-width="2.5" fill="none" />
  <rect x="405" y="506" width="100" height="26" rx="13" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="523" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">dose aplicada</text>
  <text x="375" y="512" fill="#1e293b" font-size="12" font-weight="700">1,1</text>
  <text x="525" y="512" fill="#1e293b" font-size="12" font-weight="700">0,N</text>

  <!-- 4. VACINA (0,N) para APLICACAO_VACINA (0,1) - PRÓXIMO REFORÇO -->
  <path d="M 360 575 C 430 575, 470 585, 550 585" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" fill="none" />
  <rect x="395" y="566" width="120" height="24" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="582" fill="#b45309" font-size="10" font-weight="700" text-anchor="middle">próxima vacina (reforço)</text>
  <text x="375" y="567" fill="#1e293b" font-size="11" font-weight="700">0,N</text>
  <text x="525" y="578" fill="#1e293b" font-size="11" font-weight="700">0,1</text>


  <!-- ========================================== -->
  <!-- TABELA 1: CLIENTE -->
  <!-- ========================================== -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <!-- Fundo da Entidade -->
    <rect width="310" height="315" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Cabeçalho -->
    <rect width="310" height="40" rx="8" fill="#2563eb" />
    <rect y="32" width="310" height="8" fill="#2563eb" />
    <text x="15" y="25" fill="#ffffff" font-size="14" font-weight="700">CLIENTE</text>
    <text x="295" y="25" fill="#bfdbfe" font-size="11" text-anchor="end">Tutor / Proprietário</text>

    <!-- Atributos -->
    <!-- id_cliente (PK) -->
    <rect x="12" y="50" width="28" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="63" fill="#b45309" font-size="10" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#0f172a" font-size="12" font-weight="700">id_cliente</text>
    <text x="295" y="64" fill="#64748b" font-size="11" text-anchor="end">INT (Auto)</text>
    <line x1="12" y1="74" x2="298" y2="74" stroke="#f1f5f9" stroke-width="1" />

    <!-- nome -->
    <text x="15" y="92" fill="#334155" font-size="12">nome</text>
    <text x="295" y="92" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- sobrenome -->
    <text x="15" y="114" fill="#334155" font-size="12">sobrenome</text>
    <text x="295" y="114" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- telefone -->
    <text x="15" y="136" fill="#334155" font-size="12">telefone</text>
    <text x="295" y="136" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(20)</text>

    <!-- Linha divisória de endereço composto -->
    <line x1="12" y1="148" x2="298" y2="148" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="15" y="162" fill="#0284c7" font-size="10" font-weight="700">[ Atributo Composto: Endereço ]</text>

    <!-- rua -->
    <text x="20" y="180" fill="#334155" font-size="12">rua</text>
    <text x="295" y="180" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(100)</text>

    <!-- numero -->
    <text x="20" y="202" fill="#334155" font-size="12">numero</text>
    <text x="295" y="202" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(10)</text>

    <!-- complemento -->
    <text x="20" y="224" fill="#334155" font-size="12">complemento (opcional)</text>
    <text x="295" y="224" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- bairro -->
    <text x="20" y="246" fill="#334155" font-size="12">bairro</text>
    <text x="295" y="246" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- cidade -->
    <text x="20" y="268" fill="#334155" font-size="12">cidade</text>
    <text x="295" y="268" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- estado -->
    <text x="20" y="290" fill="#334155" font-size="12">estado</text>
    <text x="295" y="290" fill="#64748b" font-size="11" text-anchor="end">CHAR(2)</text>

    <!-- cep -->
    <text x="20" y="310" fill="#334155" font-size="12">cep</text>
    <text x="295" y="310" fill="#64748b" font-size="11" text-anchor="end">CHAR(9)</text>
  </g>


  <!-- ========================================== -->
  <!-- TABELA 2: ANIMAL -->
  <!-- ========================================== -->
  <g transform="translate(550, 110)" filter="url(#shadow)">
    <rect width="310" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="310" height="40" rx="8" fill="#0284c7" />
    <rect y="32" width="310" height="8" fill="#0284c7" />
    <text x="15" y="25" fill="#ffffff" font-size="14" font-weight="700">ANIMAL</text>
    <text x="295" y="25" fill="#bae6fd" font-size="11" text-anchor="end">Paciente (Cão / Gato)</text>

    <!-- id_animal (PK) -->
    <rect x="12" y="50" width="28" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="63" fill="#b45309" font-size="10" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#0f172a" font-size="12" font-weight="700">id_animal</text>
    <text x="295" y="64" fill="#64748b" font-size="11" text-anchor="end">INT (Auto)</text>
    <line x1="12" y1="74" x2="298" y2="74" stroke="#f1f5f9" stroke-width="1" />

    <!-- nome -->
    <text x="15" y="93" fill="#334155" font-size="12">nome</text>
    <text x="295" y="93" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- data_nascimento -->
    <text x="15" y="117" fill="#334155" font-size="12">data_nascimento</text>
    <text x="295" y="117" fill="#64748b" font-size="11" text-anchor="end">DATE</text>

    <!-- especie -->
    <text x="15" y="141" fill="#334155" font-size="12">especie</text>
    <text x="295" y="141" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(30)</text>

    <!-- raca -->
    <text x="15" y="165" fill="#334155" font-size="12">raca</text>
    <text x="295" y="165" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(50)</text>

    <!-- cor -->
    <text x="15" y="189" fill="#334155" font-size="12">cor</text>
    <text x="295" y="189" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(30)</text>

    <!-- sexo -->
    <text x="15" y="213" fill="#334155" font-size="12">sexo</text>
    <text x="295" y="213" fill="#64748b" font-size="11" text-anchor="end">CHAR(1) [M/F]</text>

    <!-- id_cliente (FK) -->
    <line x1="12" y1="227" x2="298" y2="227" stroke="#e2e8f0" stroke-width="1" />
    <rect x="12" y="235" width="28" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="248" fill="#0369a1" font-size="10" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="249" fill="#0369a1" font-size="12" font-weight="700">id_cliente</text>
    <text x="295" y="249" fill="#64748b" font-size="11" text-anchor="end">INT → CLIENTE</text>
  </g>


  <!-- ========================================== -->
  <!-- TABELA 3: VACINA -->
  <!-- ========================================== -->
  <g transform="translate(50, 460)" filter="url(#shadow)">
    <rect width="310" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="310" height="40" rx="8" fill="#059669" />
    <rect y="32" width="310" height="8" fill="#059669" />
    <text x="15" y="25" fill="#ffffff" font-size="14" font-weight="700">VACINA</text>
    <text x="295" y="25" fill="#a7f3d0" font-size="11" text-anchor="end">Catálogo e Lote</text>

    <!-- id_vacina (PK) -->
    <rect x="12" y="50" width="28" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="63" fill="#b45309" font-size="10" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#0f172a" font-size="12" font-weight="700">id_vacina</text>
    <text x="295" y="64" fill="#64748b" font-size="11" text-anchor="end">INT (Auto)</text>
    <line x1="12" y1="74" x2="298" y2="74" stroke="#f1f5f9" stroke-width="1" />

    <!-- nome -->
    <text x="15" y="95" fill="#334155" font-size="12">nome</text>
    <text x="295" y="95" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(100)</text>

    <!-- laboratorio -->
    <text x="15" y="123" fill="#334155" font-size="12">laboratorio</text>
    <text x="295" y="123" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(100)</text>

    <!-- lote -->
    <text x="15" y="151" fill="#334155" font-size="12">lote</text>
    <text x="295" y="151" fill="#64748b" font-size="11" text-anchor="end">VARCHAR(30)</text>
  </g>


  <!-- ========================================== -->
  <!-- TABELA 4: APLICACAO_VACINA (ASSOCIATIVA) -->
  <!-- ========================================== -->
  <g transform="translate(550, 460)" filter="url(#shadow)">
    <rect width="340" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="340" height="40" rx="8" fill="#4f46e5" />
    <rect y="32" width="340" height="8" fill="#4f46e5" />
    <text x="15" y="25" fill="#ffffff" font-size="14" font-weight="700">APLICACAO_VACINA</text>
    <text x="325" y="25" fill="#c7d2fe" font-size="11" text-anchor="end">Histórico &amp; Notificação</text>

    <!-- id_aplicacao (PK) -->
    <rect x="12" y="50" width="28" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="63" fill="#b45309" font-size="10" font-weight="800" text-anchor="middle">PK</text>
    <text x="48" y="64" fill="#0f172a" font-size="12" font-weight="700">id_aplicacao</text>
    <text x="325" y="64" fill="#64748b" font-size="11" text-anchor="end">INT (Auto)</text>
    <line x1="12" y1="74" x2="328" y2="74" stroke="#f1f5f9" stroke-width="1" />

    <!-- id_animal (FK) -->
    <rect x="12" y="80" width="28" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="93" fill="#0369a1" font-size="10" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="94" fill="#0369a1" font-size="12" font-weight="700">id_animal</text>
    <text x="325" y="94" fill="#64748b" font-size="11" text-anchor="end">INT → ANIMAL</text>

    <!-- id_vacina (FK) -->
    <rect x="12" y="106" width="28" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="119" fill="#0369a1" font-size="10" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="120" fill="#0369a1" font-size="12" font-weight="700">id_vacina</text>
    <text x="325" y="120" fill="#64748b" font-size="11" text-anchor="end">INT → VACINA</text>

    <!-- data_aplicacao -->
    <text x="15" y="148" fill="#334155" font-size="12">data_aplicacao</text>
    <text x="325" y="148" fill="#64748b" font-size="11" text-anchor="end">DATE</text>

    <!-- id_proxima_vacina (FK) -->
    <line x1="12" y1="160" x2="328" y2="160" stroke="#fef3c7" stroke-width="1" />
    <rect x="12" y="167" width="28" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="180" fill="#b45309" font-size="10" font-weight="800" text-anchor="middle">FK</text>
    <text x="48" y="181" fill="#b45309" font-size="12" font-weight="700">id_proxima_vacina</text>
    <text x="325" y="181" fill="#64748b" font-size="11" text-anchor="end">INT → VACINA (Opc)</text>

    <!-- data_proxima_vacina -->
    <text x="15" y="209" fill="#b45309" font-size="12" font-weight="600">data_proxima_vacina</text>
    <text x="325" y="209" fill="#b45309" font-size="11" text-anchor="end">DATE (Alerta)</text>
  </g>


  <!-- ========================================== -->
  <!-- LEGENDA E NOTAS DE RODAPÉ -->
  <!-- ========================================== -->
  <g transform="translate(50, 700)">
    <rect width="950" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="26" fill="#475569" font-size="11" font-weight="600">LEGENDA:</text>
    
    <rect x="90" y="14" width="24" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="102" y="26" fill="#b45309" font-size="9" font-weight="800" text-anchor="middle">PK</text>
    <text x="120" y="26" fill="#334155" font-size="11">Chave Primária</text>

    <rect x="220" y="14" width="24" height="16" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="232" y="26" fill="#0369a1" font-size="9" font-weight="800" text-anchor="middle">FK</text>
    <text x="250" y="26" fill="#334155" font-size="11">Chave Estrangeira</text>

    <line x1="380" y1="22" x2="410" y2="22" stroke="#3b82f6" stroke-width="2.5" />
    <text x="418" y="26" fill="#334155" font-size="11">Cardinalidade 1:N</text>

    <line x1="535" y1="22" x2="565" y2="22" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" />
    <text x="573" y="26" fill="#334155" font-size="11">Vínculo de Reforço / Notificação</text>

    <text x="930" y="26" fill="#64748b" font-size="10" text-anchor="end">SENAI 2026</text>
  </g>
</svg>
